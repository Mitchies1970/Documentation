site_name: Acme App Docs
site_url: https://mitchies1970.github.io/Documentation/
site_description: Documentation template for Acme App — rename this product throughout when you adopt the template
site_author: Your Name

repo_url: https://github.com/Mitchies1970/Documentation
repo_name: Mitchies1970/Documentation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Getting started: guides/getting-started.md
      - Installation: guides/installation.md
      - Configuration: guides/configuration.md
      - How to deploy: guides/how-to-deploy.md
  - Reference:
      - Architecture: reference/architecture.md
      - CLI: reference/cli.md
      - Config reference: reference/config.md
      - Glossary: reference/glossary.md
  - API:
      - Overview: api/index.md
      - Users: api/users.md
      - Projects: api/projects.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
