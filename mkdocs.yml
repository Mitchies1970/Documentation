site_name: Mitchies1970 Docs
site_url: https://mitchies1970.github.io/Documentation/
site_description: Central documentation for Mitchies1970 products
site_author: Mitchies1970

repo_url: https://github.com/Mitchies1970/Documentation
repo_name: Mitchies1970/Documentation
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Contributing: contributing.md
  - SDSD:
      - Overview: sdsd/index.md
      - Guides:
          - Run the React frontend: sdsd/guides/run-the-react-frontend.md
          - Learn React:
              - Start here: sdsd/guides/learn-react.md
              - Components and JSX: sdsd/guides/components-and-jsx.md
              - Props: sdsd/guides/props.md
              - Composition: sdsd/guides/composition.md
              - State and events: sdsd/guides/state-and-events.md
              - Lists and conditions: sdsd/guides/lists-and-conditions.md
              - Load data on mount: sdsd/guides/effects-and-loading.md
              - Routing: sdsd/guides/routing.md
              - Context: sdsd/guides/context.md
      - Reference:
          - React frontend: sdsd/reference/react-frontend.md
  - TAnbnb:
      - Overview: tanbnb/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
